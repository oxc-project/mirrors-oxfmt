name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  validate:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - run: pip install pre-commit
      - run: pre-commit validate-manifest .pre-commit-hooks.yaml
      - name: Check mirrored version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = Path(".version").read_text().strip()
          manifest = Path(".pre-commit-hooks.yaml").read_text()
          dependency = re.search(r'additional_dependencies: \["oxfmt@([^"]+)"\]', manifest)

          if dependency is None:
              raise SystemExit("oxfmt dependency not found in .pre-commit-hooks.yaml")
          if dependency.group(1) != version:
              raise SystemExit(
                  f"version mismatch: .version={version}, dependency={dependency.group(1)}"
              )
          PY
